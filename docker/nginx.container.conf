# 容器版 nginx 配置（P4-43）
#
# 与宿主机那份 `nginx-1.20.2/conf/nginx.conf` 的关键约定保持一致：
#   1. 只反代 `/api/` 到后端，**不要**单独配 location /admin/ 或 /user/，
#      否则它们的优先级高于 location /，会截获前端 SPA 路由导致刷新 404；
#   2. 传 X-Real-IP / X-Forwarded-For —— 后端按这两个头取真实 IP 做限流，
#      缺了它们所有请求会被算成同一个 IP（限流误伤）；
#   3. index.html 不缓存、带 hash 的 /assets/ 长缓存。

server {
    listen       80;
    server_name  localhost;

    # 图片上传走这里，必须放开大小限制
    client_max_body_size 10m;

    root   /usr/share/nginx/html;
    index  index.html;

    # 入口页不缓存：避免浏览器缓存旧 index，而它引用的 hash 资源已被新构建替换 → 白屏
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 带内容 hash 的构建产物可以长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口：找不到的路径一律回退到 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口（含 knife4j 文档 /api/doc.html 与 WebSocket /api/ws/detect）
    location /api/ {
        proxy_pass   http://server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # WebSocket 升级（检测结果推送）
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
