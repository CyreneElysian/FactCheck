server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    # 默认同时激活 dev 与 local（后者的值覆盖前者）：
    #   - 本地存在 application-local.yml → 自动使用真实密钥，无需任何额外设置
    #   - 新克隆的仓库没有该文件 → 自动跳过，回落到 dev 的安全默认值，仍能正常启动
    #   （若默认只写 local，没有本地密钥文件的环境会因 dev 未加载而启动失败）
    # 也可用环境变量 FACTCHECK_PROFILE 覆盖，或在 IDEA 的 Active profiles 里指定（例如只填 local）
    active: ${FACTCHECK_PROFILE:dev,local}
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      # springfox 3.0.0（knife4j 接口文档的底层）与 Spring Boot 2.6+ 的兼容要求：
      # Boot 2.6 起默认路径匹配策略换成了 PathPatternParser，springfox 只支持 AntPathMatcher，
      # 不显式设置会在启动/访问 /doc.html 时报错
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      driver-class-name: ${fact-check.datasource.driver-class-name}
      url: jdbc:mysql://${fact-check.datasource.host}:${fact-check.datasource.port}/${fact-check.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${fact-check.datasource.username}
      password: ${fact-check.datasource.password}
  redis:
    host: ${fact-check.redis.host}
    port: ${fact-check.redis.port}
    # 密码由 application-dev.yml / application-local.yml 或环境变量 FACTCHECK_REDIS_PASSWORD 提供；
    # 值为空字符串时不发送 AUTH，可直连未设密码的本地 Redis
    password: ${fact-check.redis.password}
    database: ${fact-check.redis.database}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.factcheck.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      factcheck:
        mapper: debug
        service: info
        controller: info

fact-check:
  jwt:
    # ⚠️ 这两个键**刻意不提供默认值**。
    #
    # 为什么要去掉默认值（踩过的坑）：
    #   原先写的是 `${FACTCHECK_JWT_USER_SECRET:bb2db55...}`，看起来"有兜底"很安全，
    #   实际却造成一类极难定位的静默失败 —— 容器化时 compose 用 `${VAR:-}` 注入，
    #   变量未设置就传了**空字符串**；Spring 对"已定义但为空"的环境变量取空值、
    #   **不会**回落到这里的默认值 → jjwt 0.12.x 要求 HMAC 密钥 ≥256 位 → 登录在
    #   "签发 token"这一步抛异常，前端只看到一句「未知错误」
    #   （而密码校验、写 last_login_time 都已成功，所以完全看不出是密钥问题）。
    #
    #   去掉默认值后：未设置 = 占位符无法解析 → **启动即失败**，且报错直接指向这个键。
    #   另有 FactCheckApplication.validateJwtSecrets() 兜住"设了但过短/为空"的情况。
    #
    # 各环境的注入方式：
    #   容器     ：docker-compose.yml 从宿主机环境变量传入（见那里的注释，含生成命令）
    #   本地裸机 ：写进 application-local.yml（该文件已 gitignore）
    #   生产     ：一律用环境变量，不要落到任何文件里
    user-secret-key: ${FACTCHECK_JWT_USER_SECRET}
    user-ttl: 7200000
    user-token-name: authentication
    admin-secret-key: ${FACTCHECK_JWT_ADMIN_SECRET}
    admin-ttl: 7200000
    admin-token-name: token
  agent:
    base-url: ${FACTCHECK_AGENT_BASE_URL:http://127.0.0.1:8001}
    # 读超时（秒）。必须大于 Python 侧 DETECT_TOTAL_BUDGET（默认 45s），
    # 否则 Java 会先判失败，而 Agent 仍在执行（可能已写入向量索引），造成两侧状态不一致
    timeout: ${FACTCHECK_AGENT_TIMEOUT:90}
    # "检测中"卡死多久之后允许被重新认领（分钟）。异步任务只在内存里，
    # 后端崩溃/重启会让记录永远停在 status=0；超过该阈值后，重新提交同一内容会原子认领并重跑。
    # 不要取太小：正常检测可达数十秒，阈值过短会让"连点两次提交"变成两次真实 Agent 调用。
    detecting-stale-minutes: ${FACTCHECK_AGENT_DETECTING_STALE_MINUTES:10}
    # ⚠️ semantic-threshold 是**占位配置，改了不生效也不会有任何告警**：
    # 语义去重阈值的真正生效点是 Python 侧 fact-agent/.env 的 DEDUP_THRESHOLD
    # （见《技术方案》§5.4）。保留它是为了与配置清单一致。
    semantic-threshold: 0.92
    # 下面三项**真正生效**，由 DetectServiceImpl.submit 读取：
    #   exact-enabled  → 是否做精确去重（content_hash 命中直接复用结论）
    #   semantic-enabled → 是否做语义去重（调 Agent /dedup）
    #   min-text-length  → 低于该长度只做精确去重、不做语义去重
    exact-enabled: true
    semantic-enabled: true
    min-text-length: 8
    # 内部鉴权令牌（P2-21）：作为 X-Internal-Token 发给 Python Agent，
    # **必须与 Python 侧 .env 的 INTERNAL_TOKEN 一致**，否则 Agent 会返回 401（fail-closed）。
    # 下面的默认值仅供本地联调，生产环境务必用环境变量覆盖
    internal-token: ${FACTCHECK_AGENT_INTERNAL_TOKEN:dev-internal-token-change-me}
  ocr:
    endpoint: ${FACTCHECK_OCR_ENDPOINT:https://ocrapi-advanced.taobao.com/ocrservice/advanced}
    # 留空表示未配置：OcrServiceImpl 会直接抛出"OCR 识别失败"，避免用占位符发起无效请求
    app-code: ${FACTCHECK_OCR_APP_CODE:}
  content-safety:
    # 内容安全审核：命中"违法交易/招揽"类规则直接拒绝；命中敏感话题只留痕放行（详见技术方案第 10 章）
    enabled: ${FACTCHECK_CONTENT_SAFETY_ENABLED:true}
    # 审核实现：local = 本地确定性规则（离线可用）。接云端审核时实现 ContentSafetyChecker
    # 并把 provider 改成对应实现名即可，业务代码无需改动
    provider: ${FACTCHECK_CONTENT_SAFETY_PROVIDER:local}
    # 图片地址允许的域名白名单，为空表示仅校验协议与主机名（把 OSS 域名填进来可进一步收紧）
    image-host-whitelist: []
  rate-limit:
    # 限流（S9）：检测提交 / 登录 / 注册三个场景，Redis INCR + EXPIRE 实现
    enabled: ${FACTCHECK_RATE_LIMIT_ENABLED:true}
    detect-per-day: ${FACTCHECK_RATE_LIMIT_DETECT_PER_DAY:50}
    # 登录：按用户名拦针对性爆破 + 按 IP 拦批量撞库。
    # 只限流、不锁定账号——硬锁账号会被用来做拒绝服务（知道用户名就能把真实用户锁在门外）
    login-per-username: ${FACTCHECK_RATE_LIMIT_LOGIN_PER_USERNAME:5}
    login-per-ip: ${FACTCHECK_RATE_LIMIT_LOGIN_PER_IP:20}
    login-window-minutes: ${FACTCHECK_RATE_LIMIT_LOGIN_WINDOW_MINUTES:10}
    # 注册：同一 IP 每小时最多 5 次，防批量注册小号
    register-per-ip: ${FACTCHECK_RATE_LIMIT_REGISTER_PER_IP:5}
    register-window-minutes: ${FACTCHECK_RATE_LIMIT_REGISTER_WINDOW_MINUTES:60}
    # 微信绑定：该接口在鉴权白名单里且每次都会请求微信 code2session，按 IP 限流防被当跳板刷
    wechat-bind-per-ip: ${FACTCHECK_RATE_LIMIT_WECHAT_BIND_PER_IP:10}
    wechat-bind-window-minutes: ${FACTCHECK_RATE_LIMIT_WECHAT_BIND_WINDOW_MINUTES:10}
  hot:
    # 热度榜（技术方案 5.1）：检测 +1 / 查看详情 +0.5 / 申诉 +3 / 人工诊断 +2 / 命中权威信息 +5
    # 查看详情的去重窗口：同一用户对同一记录在该窗口内只计一次，防止刷新详情页刷榜
    view-dedup-minutes: ${FACTCHECK_HOT_VIEW_DEDUP_MINUTES:30}
  websocket:
    # 允许的 WebSocket 握手来源（Origin）。默认 "*" 仅为方便本地开发
    # （前端可能来自 Vite 5173、也可能来自 nginx 的 80/8081）。
    #
    # ⚠️ 生产环境请改成真实前端域名，逗号分隔，例如：
    #     FACTCHECK_WS_ALLOWED_ORIGINS=https://factcheck.example.com,https://www.factcheck.example.com
    # 说明：本项目的手势鉴权是**显式 token 查询参数**（非 cookie），因此放开来源不构成典型
    # CSWSH；收窄来源属于纵深防御，并能在将来鉴权方式改为 cookie 时提前拆除风险。
    allowed-origins: ${FACTCHECK_WS_ALLOWED_ORIGINS:*}
  alioss:
    endpoint: ${fact-check.alioss.endpoint}
    access-key-id: ${fact-check.alioss.access-key-id}
    access-key-secret: ${fact-check.alioss.access-key-secret}
    bucket-name: ${fact-check.alioss.bucket-name}
  wechat:
    appid: ${fact-check.wechat.appid}
    secret: ${fact-check.wechat.secret}
