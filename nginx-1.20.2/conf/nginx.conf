# ============================================================================
# FactCheck Nginx 配置
#
#   /        前端静态资源（Vue3 构建产物，SPA + history 路由）
#   /api/    Spring Boot 后端（context-path = /api，同时承载 WebSocket 升级）
#
# 使用前：
#   1) 将 fact-check-web 的 dist 内容复制到 html/fact-check/
#   2) 启动后端（默认 127.0.0.1:8080）
#   3) Windows: start nginx        Linux/macOS: ./nginx
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # ------------------------------------------------------------------
    # gzip：前端主包约 1.1MB，开启后可显著降低首屏传输体积
    # ------------------------------------------------------------------
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml
                      application/x-javascript image/svg+xml
                      font/woff font/woff2;

    # ------------------------------------------------------------------
    # WebSocket 升级所需的 Connection 头映射
    # ------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream webservers {
        server 127.0.0.1:8080;
    }

    server {
        listen       80;
        server_name  localhost;

        # index.html 不缓存：避免浏览器缓存旧 index，
        # 而它引用的 hash 资源已被新构建替换导致白屏
        location = /index.html {
            root       html/fact-check;
            add_header Cache-Control "no-store, must-revalidate";
        }

        # 带内容 hash 的构建产物可长期强缓存
        location /assets/ {
            root       html/fact-check;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # SPA 入口：找不到的路径一律回退到 index.html，交给前端路由
        location / {
            root   html/fact-check;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # ------------------------------------------------------------------
        # 统一 API 反向代理（含 WebSocket 升级）
        #
        # ⚠️ 不要再单独配置 location /admin/ 或 location /user/：
        #    它们的优先级高于 location /，会截获前端 SPA 路由
        #    （如 /admin/dashboard），刷新页面时被转发到后端而产生 404。
        #    前端所有请求都走 /api 前缀。
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass   http://webservers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "$connection_upgrade";
        }
    }
}
