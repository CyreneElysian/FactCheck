# 事实检测平台 —— 一键编排（P4-43）
#
# 为什么用 Compose：技术方案 §12 就建议了容器化编排，但一直没落地，
# 导致"新机器起项目"要手工装 MySQL/Redis/Java/Python/nginx 五套环境。
#
# ⚠️ 首次启动需要网络：
#   1. 拉取基础镜像（mysql:8.0 / redis:7 / maven / python / nginx）
#   2. Java 镜像内用 Maven 拉依赖、Agent 镜像内 pip 装依赖
#   3. Agent 首次启动下载 embedding 模型（或提前把模型放进 fact-agent/models 并改 EMBEDDING_MODEL）
# 之后再次 `docker compose up` 可完全离线。
#
# 用法：
#   docker compose up -d --build          # 构建并启动全部服务
#   docker compose logs -f server         # 看后端日志
#   docker compose down -v                # 停掉并清空数据卷（会删库数据）
#
# 前端静态资源：默认挂载本机 `fact-check-web/dist`（先在本机 `npm run build`）。
#
# 路径约定：本文件放在项目根（fact-check/），所有相对路径都以**本文件所在目录**为基准；
# 注意 `dockerfile` 是相对 `build.context` 解析的，不是相对本文件。

services:
  mysql:
    image: mysql:8.0
    container_name: fc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-factcheck_root}
      MYSQL_DATABASE: fact_check
      MYSQL_USER: ${MYSQL_USER:-factcheck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-factcheck_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 与 druid 连接池配合，避免容器网络抖动导致连接被单方面断开
      - --wait-timeout=28800
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表。
      # ⚠️ MySQL 官方 entrypoint 会**按文件名字典序**执行本目录下的 *.sql，
      #    且**不递归子目录**（所以 sql/migrations/ 里的迁移脚本不会在这里被执行，这是刻意的）。
      #    文件名前缀 01/ 02/ 是必需的：若叫 fact_check_init.sql / fact_check_schema.sql，
      #    字典序会把 init 排在 schema 前面，初始化先于建表执行而失败（set -e 下 MySQL 容器直接退出）。
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      # 只在需要从宿主机连库时暴露；生产可删掉这一行
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-factcheck_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [fc-net]

  redis:
    image: redis:7-alpine
    container_name: fc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fc-net]

  agent:
    build:
      context: ./fact-agent
      dockerfile: ../docker/Dockerfile.agent
    container_name: fc-agent
    restart: unless-stopped
    env_file:
      # 顺序有意义：后加载的覆盖先加载的。
      # .env.example 提供"能启动"的默认值（新克隆的机器上没有 .env 也能起来），
      # .env（gitignored，含真实密钥）存在时覆盖它；required: false 让缺失不报错。
      - ./fact-agent/.env.example
      - path: ./fact-agent/.env
        required: false
    environment:
      # 容器内必须监听 0.0.0.0，否则只有容器自己能访问
      AGENT_HOST: 0.0.0.0
      AGENT_DATA_DIR: /app/data
      # 与 server 服务保持一致的内部鉴权令牌（两侧必须相同，否则一律 401）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      # 向量索引与元数据持久化，避免重建容器就丢
      - agent-data:/app/data
      # 本地已下载的模型可直接挂进来，省去首次下载
      - ./fact-agent/models:/app/models:ro
    ports:
      # 默认不对宿主机暴露：Agent 只需被同网络的 server 调用。
      # 需要本机调试时再打开（同时务必更换 INTERNAL_TOKEN）。
      - "${AGENT_BIND:-127.0.0.1}:${AGENT_PORT:-8001}:8001"
    healthcheck:
      # /health 不需要内部令牌，适合做探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fc-net]

  server:
    build:
      context: ./fact-check
      dockerfile: ../docker/Dockerfile.server
    container_name: fc-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      # ⚠️ 容器里**只激活 dev**，不要把 local 也带上。
      # application.yml 的默认值是 `dev,local`：本机跑时 local 用 application-local.yml 覆盖 dev（方便），
      # 但该文件里写的是 `localhost` / `root` / `1234`，在容器里会把下面这些变量全部覆盖掉，
      # 于是后端去连 `localhost:3306`（= 它自己）而不是 `mysql` 服务 → 启动即失败。
      # application-local.yml 默认会打进 jar（P3-36 的取舍，见 docs/项目改进清单.md §3.1），
      # 所以必须在环境里显式排除它。
      FACTCHECK_PROFILE: dev
      # 变量名必须与 application-dev.yml 里 `fact-check.datasource.*` 的占位符一致：
      # `${FACTCHECK_DB_HOST:localhost}` / `${FACTCHECK_DB_PORT:3306}` /
      # `${FACTCHECK_DB_NAME:fact_check}` / `${FACTCHECK_DB_USERNAME:root}` / `${FACTCHECK_DB_PASSWORD:}`
      # （早前这里写的是 FACTCHECK_DATASOURCE_URL/USERNAME/PASSWORD，那三个变量**代码里根本不存在**，
      #   结果容器一直连 localhost:3306 而报 Communications link failure。）
      FACTCHECK_DB_HOST: mysql
      FACTCHECK_DB_PORT: 3306
      FACTCHECK_DB_NAME: fact_check
      FACTCHECK_DB_USERNAME: ${MYSQL_USER:-factcheck}
      FACTCHECK_DB_PASSWORD: ${MYSQL_PASSWORD:-factcheck_pass}
      FACTCHECK_REDIS_HOST: redis
      FACTCHECK_REDIS_PORT: 6379
      FACTCHECK_AGENT_BASE_URL: http://agent:8001
      FACTCHECK_AGENT_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      # 密钥类配置一律从宿主机环境注入，不写进镜像。
      #
      # ⚠️ 这里用 `${VAR:-}`（未设置时传空串）而**不是** `${VAR:?}`：
      #    `:?` 会让 compose **解析整个文件时**就报错，于是连 `docker compose ps` /
      #    `config` 这类只读命令都没法用（实测踩到：想查容器状态却先被密钥报错挡住）。
      #    因此"必须设置密钥"改由**应用启动时**强制：
      #      - application.yml 里这两个键**不再提供默认值**，未设置时 Spring 直接启动失败；
      #      - FactCheckApplication.validateJwtSecrets() 再校验长度 ≥32 字节（空串/过短都拦）。
      #    这样只读命令随时可用，而真正启动服务时仍然"配置不对就起不来"。
      #
      #    生成方式（任选）：
      #      PowerShell : $env:FACTCHECK_JWT_USER_SECRET = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Max 16) })
      #      Linux/macOS: export FACTCHECK_JWT_USER_SECRET=$(openssl rand -hex 32)
      #    本地裸机跑（不走容器）时把这两个键写进 application-local.yml 即可，无需环境变量。
      FACTCHECK_JWT_USER_SECRET: ${FACTCHECK_JWT_USER_SECRET:-}
      FACTCHECK_JWT_ADMIN_SECRET: ${FACTCHECK_JWT_ADMIN_SECRET:-}
      # ⚠️ 变量名必须与 application.yml / application-dev.yml 里**实际读取**的占位符逐字一致。
      #    这里曾写错两组（同一个"名字对不上但 compose config 不报错"的坑）：
      #      compose 旧写法                    → 代码实际读取
      #      FACTCHECK_OSS_ACCESS_KEY_ID      → FACTCHECK_OSS_AK
      #      FACTCHECK_OSS_ACCESS_KEY_SECRET  → FACTCHECK_OSS_SK
      #      FACTCHECK_WECHAT_APP_ID          → FACTCHECK_WECHAT_APPID
      #      FACTCHECK_WECHAT_APP_SECRET      → FACTCHECK_WECHAT_SECRET
      #    后果：容器里这几个凭证恒为空，OSS 上传与小程序登录静默不可用。
      #    `run-checks.ps1` 的 compose-env 检查会拦住这类问题。
      FACTCHECK_OSS_AK: ${FACTCHECK_OSS_ACCESS_KEY_ID:-}
      FACTCHECK_OSS_SK: ${FACTCHECK_OSS_ACCESS_KEY_SECRET:-}
      FACTCHECK_WECHAT_APPID: ${FACTCHECK_WECHAT_APP_ID:-}
      FACTCHECK_WECHAT_SECRET: ${FACTCHECK_WECHAT_APP_SECRET:-}
      # WebSocket 允许的握手来源。默认 "*"（不限制）仅便于本地开发；
      # 生产建议改成真实前端域名，例如 https://factcheck.example.com（多个用逗号分隔）。
      # 注意：**设成 "*" 时不要指望它被拦** —— 该变量只做纵深防御。
      FACTCHECK_WS_ALLOWED_ORIGINS: ${FACTCHECK_WS_ALLOWED_ORIGINS:-*}
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # knife4j 的接口文档地址，返回 200 说明 MVC 与文档链路都起来了
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/api/doc.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [fc-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: fc-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./docker/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态资源（先在本机 npm run build 生成 dist）
      - ./fact-check-web/dist:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks: [fc-net]

volumes:
  mysql-data:
  redis-data:
  agent-data:

networks:
  fc-net:
    driver: bridge
