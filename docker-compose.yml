# 事实检测平台 —— 一键编排（P4-43）
#
# 为什么用 Compose：技术方案 §12 就建议了容器化编排，但一直没落地，
# 导致"新机器起项目"要手工装 MySQL/Redis/Java/Python/nginx 五套环境。
#
# ⚠️ 首次启动需要网络：
#   1. 拉取基础镜像（mysql:8.0 / redis:7 / maven / python / nginx）
#   2. Java 镜像内用 Maven 拉依赖、Agent 镜像内 pip 装依赖
#   3. Agent 首次启动下载 embedding 模型（或提前把模型放进 fact-agent/models 并改 EMBEDDING_MODEL）
# 之后再次 `docker compose up` 可完全离线。
#
# 用法：
#   docker compose up -d --build          # 构建并启动全部服务
#   docker compose logs -f server         # 看后端日志
#   docker compose down -v                # 停掉并清空数据卷（会删库数据）
#
# 前端静态资源：默认挂载本机 `fact-check-web/dist`（先在本机 `npm run build`）。
#
# 路径约定：本文件放在项目根（fact-check/），所有相对路径都以**本文件所在目录**为基准；
# 注意 `dockerfile` 是相对 `build.context` 解析的，不是相对本文件。

services:
  mysql:
    image: mysql:8.0
    container_name: fc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-factcheck_root}
      MYSQL_DATABASE: fact_check
      MYSQL_USER: ${MYSQL_USER:-factcheck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-factcheck_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 与 druid 连接池配合，避免容器网络抖动导致连接被单方面断开
      - --wait-timeout=28800
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表（sql/ 目录下的 .sql 会按文件名顺序执行）
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      # 只在需要从宿主机连库时暴露；生产可删掉这一行
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-factcheck_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [fc-net]

  redis:
    image: redis:7-alpine
    container_name: fc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fc-net]

  agent:
    build:
      context: ./fact-agent
      dockerfile: ../docker/Dockerfile.agent
    container_name: fc-agent
    restart: unless-stopped
    env_file:
      # 顺序有意义：后加载的覆盖先加载的。
      # .env.example 提供"能启动"的默认值（新克隆的机器上没有 .env 也能起来），
      # .env（gitignored，含真实密钥）存在时覆盖它；required: false 让缺失不报错。
      - ./fact-agent/.env.example
      - path: ./fact-agent/.env
        required: false
    environment:
      # 容器内必须监听 0.0.0.0，否则只有容器自己能访问
      AGENT_HOST: 0.0.0.0
      AGENT_DATA_DIR: /app/data
      # 与 server 服务保持一致的内部鉴权令牌（两侧必须相同，否则一律 401）
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
    volumes:
      # 向量索引与元数据持久化，避免重建容器就丢
      - agent-data:/app/data
      # 本地已下载的模型可直接挂进来，省去首次下载
      - ./fact-agent/models:/app/models:ro
    ports:
      # 默认不对宿主机暴露：Agent 只需被同网络的 server 调用。
      # 需要本机调试时再打开（同时务必更换 INTERNAL_TOKEN）。
      - "${AGENT_BIND:-127.0.0.1}:${AGENT_PORT:-8001}:8001"
    healthcheck:
      # /health 不需要内部令牌，适合做探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fc-net]

  server:
    build:
      context: ./fact-check
      dockerfile: ../docker/Dockerfile.server
    container_name: fc-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_started
    environment:
      # dev,local 两个 profile：dev 提供默认配置，local 读环境变量
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # 容器内用服务名访问，不能用 127.0.0.1
      FACTCHECK_DATASOURCE_URL: jdbc:mysql://mysql:3306/fact_check?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      FACTCHECK_DATASOURCE_USERNAME: ${MYSQL_USER:-factcheck}
      FACTCHECK_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-factcheck_pass}
      FACTCHECK_REDIS_HOST: redis
      FACTCHECK_REDIS_PORT: 6379
      FACTCHECK_AGENT_BASE_URL: http://agent:8001
      FACTCHECK_AGENT_INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      # 密钥类配置一律从宿主机环境注入，不写进镜像
      FACTCHECK_JWT_USER_SECRET: ${FACTCHECK_JWT_USER_SECRET:-}
      FACTCHECK_JWT_ADMIN_SECRET: ${FACTCHECK_JWT_ADMIN_SECRET:-}
      FACTCHECK_OSS_ACCESS_KEY_ID: ${FACTCHECK_OSS_ACCESS_KEY_ID:-}
      FACTCHECK_OSS_ACCESS_KEY_SECRET: ${FACTCHECK_OSS_ACCESS_KEY_SECRET:-}
      FACTCHECK_WECHAT_APP_ID: ${FACTCHECK_WECHAT_APP_ID:-}
      FACTCHECK_WECHAT_APP_SECRET: ${FACTCHECK_WECHAT_APP_SECRET:-}
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      # knife4j 的接口文档地址，返回 200 说明 MVC 与文档链路都起来了
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8080/api/doc.html || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [fc-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: fc-nginx
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./docker/nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端静态资源（先在本机 npm run build 生成 dist）
      - ./fact-check-web/dist:/usr/share/nginx/html:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    networks: [fc-net]

volumes:
  mysql-data:
  redis-data:
  agent-data:

networks:
  fc-net:
    driver: bridge
